name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# ── Security: minimal token scope ─────────────────────────────────────────────
permissions:
  contents: read
  packages: write          # push/pull Docker image to GHCR

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/orbbec-android-build

jobs:
  # ── Build with Docker ────────────────────────────────────────────────────────
  build:
    name: Build orbbec-android-wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache the Gradle home on the runner so dependencies survive between runs.
      # The Docker run step mounts this directory into the container.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Build the image, pulling cached layers from GHCR.
      # On main/master pushes the image is also pushed to GHCR so
      # subsequent runs (including on feature branches) reuse it.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: |
            orbbec-android-build:latest
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
            type=gha
          cache-to: type=gha,mode=max

      # Push image to GHCR on main/master so future runs can pull cached layers
      - name: Push Docker image to GHCR
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker push "${{ env.DOCKER_IMAGE }}:latest"
          docker push "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: Build Debug APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.gradle:/root/.gradle \
            -w /workspace \
            orbbec-android-build \
            ./gradlew :example:assembleDebug \
              --stacktrace \
              --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Build Release APK
        if: >-
          github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.gradle:/root/.gradle \
            -w /workspace \
            orbbec-android-build \
            ./gradlew :example:assembleRelease \
              --stacktrace \
              --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbbec-data-collector-debug
          path: example/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        if: >-
          github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@v4
        with:
          name: orbbec-data-collector-release
          path: example/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error
