pluginManagement {
    repositories {
        // Canonical repos first – avoids slow round-trips to Aliyun mirrors
        // from CI runners outside China.
        google()
        mavenCentral()
        gradlePluginPortal()
        // Aliyun mirrors – faster fallback for builds in China
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
//        maven { url 'https://maven.aliyun.com/repository/jcenter/' } // Office jcenter stop service not need to use agent
        maven { url 'https://maven.aliyun.com/repository/central/' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Canonical repos first – avoids slow round-trips to Aliyun mirrors
        // from CI runners outside China.
        google()
        mavenCentral()
        // Aliyun mirrors – faster fallback for builds in China
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
//        maven { url 'https://maven.aliyun.com/repository/jcenter/' } // Office jcenter stop service not need to use agent
        maven { url 'https://maven.aliyun.com/repository/central/' }
    }
}

rootProject.name = "Obsensor_android"
include ':example'
include ':obsensor_jni'
